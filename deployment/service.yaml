apiVersion: v1
kind: Service
metadata:
  name: backend-api-service
  labels:
    app: backend-api
spec:
  selector:
    app: backend-api
  ports:
    - name: http
      port: 4545
      targetPort: 4545
  type: LoadBalancer

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend-api-monitor
  namespace: default
  labels:
    release: kube-prometheus-stack   # ← должен совпадать с именем release Helm
spec:
  selector:
    matchLabels:
      app: backend-api
  endpoints:
    - port: http      # имя порта из Service
      path: /metrics
      interval: 15s  